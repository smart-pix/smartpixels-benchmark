[project]
name = "smartpix-bench"
version = "0.1.0"
description = "Smart-pixel pT-filter classification and cluster-regression benchmarks (MLCommons science benchmark ontology)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pyarrow>=17,<26",  # pyarrow 26 needs NumPy 2; TF 2.15 needs NumPy 1
]

[project.optional-dependencies]
tf = ["tensorflow==2.15.1", "qkeras==0.9.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartpix_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
